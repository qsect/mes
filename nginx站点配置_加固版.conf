server
{
    listen 8666;
    server_name ieslab.com;
    index index.html index.php;

    # 前端编译产物根目录
    root /www/wwwroot/vite/frontend/dist;

    # ★ 安全加固：请求体上限，避免超大上传把 PHP-FPM / 磁盘打满
    #   注意 nginx 默认只有 1m，会导致 >1MB 的 PDF / Excel 上传直接 413
    client_max_body_size 50m;

    # ★ 安全加固：全局安全响应头
    #   （以下 4 个头对静态页与接口都生效，无兼容风险）
    add_header X-Content-Type-Options "nosniff" always;          # 禁止浏览器 MIME 嗅探，遏制上传文件被当脚本解析
    add_header X-Frame-Options "SAMEORIGIN" always;              # 防点击劫持
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # 防会话 ID / 路径经 Referer 外泄
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ★ 可选：内容安全策略。Vite + Element Plus 依赖运行时内联样式，
    #   因此 script-src 必须保留 'self'，style-src 需要 'unsafe-inline'。
    #   上线前建议先在浏览器控制台观察是否报错，确认无阻后再放开。
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # 错误页与日志
    error_page 404 /404.html;
    access_log  /www/wwwlogs/ieslab.com.log;
    error_log   /www/wwwlogs/ieslab.com.error.log;

    # 1. 核心修复：最高优先级精确匹配所有 /api/ 请求，直接转交后端 PHP 入口
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/vite/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;

        # 接口不缓存，避免代理/浏览器缓存到带身份的数据
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. 后端上传文件（图片等）目录映射
    # 代码里保存的路径形如 /uploads/assets/xxx.jpg，必须用 ^~ 优先于下面的正则匹配
    location ^~ /uploads/ {
        alias /www/wwwroot/vite/backend/public/uploads/;
        expires 7d;

        # ★ 注意：只要本 location 里出现 add_header，server 级的 add_header 就会被整体覆盖，
        #   所以这里必须把安全头再写一遍。
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ============================================================
        # ★ M7 安全加固：上传目录内禁止访问任何脚本 / 敏感文件
        #
        #   为什么必须写成【嵌套 location】：
        #   外层用了 `^~ /uploads/`，一旦命中 nginx 就不再检查正则 location，
        #   所以在最外层写 `location ~* \.php$` 会被屏蔽、永远不生效。
        #   写在 `^~ /uploads/` 内部才会参与匹配。
        #
        #   为什么需要它：
        #   本 server 没有通用的 `location ~ \.php$`，上传的 .php 不会被解析执行，
        #   但会被当“静态文件”把源码原样返回（源码泄露）。这里显式 403 阻断，
        #   同时为将来万一引入 PHP location 做兜底（防止 webshell 被解析）。
        # ============================================================
        location ~* \.(php|php[0-9]|phtml|phar|pht|shtml|asp|aspx|jsp|cgi|pl|py|sh|bash|bak|old|orig|swp|sql|log|ini|conf)$ {
            deny all;
            return 403;
        }

        # 禁止访问上传目录内的隐藏文件（.htaccess / .user.ini / .env 等）
        location ~ /\. {
            deny all;
            return 403;
        }

        try_files $uri =404;
    }

    # 3. 修复直接访问 /assets/ 报 403
    #    Vite 产物目录也叫 assets，直接访问 /assets/ 会命中 dist/assets/ 真实目录
    #    而 nginx 关闭了 autoindex，故返回 403；这里强制返回 index.html 交给前端路由
    location = /assets/ {
        try_files /index.html =404;
    }

    # 4. 前端单页应用 (SPA) 路由回退支持
    #    去掉 $uri/，避免非精确的目录请求也触发 403
    location / {
        try_files $uri /index.html;
    }

    # 5. 静态资源缓存（同样需要重复安全头，否则会被本块的 add_header 覆盖）
    location ~* \.(gif|jpg|jpeg|png|bmp|swf|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 6. 禁止访问敏感文件及目录
    location ~* (\.env|\.git|\.svn|node_modules) {
        return 404;
    }

    # 7. ★ 兜底：禁止从 web 访问定时任务目录
    #    cron 脚本设计上已强制 CLI-only（bootstrap.php + 脚本头部双重拦截），
    #    这里再加一道 nginx 层拦截，即使将来目录被误配置到 web 根内也访问不到。
    location ^~ /cron/ {
        deny all;
        return 404;
    }
    location ^~ /backend/ {
        deny all;
        return 404;
    }
    location ^~ /vendor/ {
        deny all;
        return 404;
    }
}
